<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IAR" />
  <title>АРМ Следователя — Автоматизированное рабочее место</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%230d1b3e'/%3E%3Cpath d='M60 12 L100 28 V60 C100 86 82 103 60 111 C38 103 20 86 20 60 V28 Z' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M36 66 L54 48 L65 58 L84 39' fill="none" stroke='%2338bdf8' stroke-width='7.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M70 39 H84 V53' fill="none" stroke='%2338bdf8' stroke-width='7.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ctext x='60' y='88' text-anchor="middle" fill='%23ffffff' font-family='Inter, Arial, sans-serif' font-weight='800' font-size='22' letter-spacing='1'%3EIAR%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      window.supabase = {
        createClient: function(url) {
          const projectRef = (url || '').replace(/^https?:\/\//, '').split('.')[0] || 'local';
          const sessionKey = 'sb-' + projectRef + '-auth-token';

          function readSession() {
            try {
              const raw = localStorage.getItem(sessionKey);
              if (!raw) return null;
              const parsed = JSON.parse(raw);
              const s = parsed && parsed.currentSession ? parsed.currentSession : parsed;
              if (s && s.user) return s;
              return null;
            } catch (e) {
              return null;
            }
          }

          function writeSession(user) {
            const session = {
              access_token: 'offline_token',
              token_type: 'bearer',
              user: user
            };
            try {
              localStorage.setItem(sessionKey, JSON.stringify(session));
            } catch (e) {}
            return session;
          }

          return {
            auth: {
              async getSession() {
                return { data: { session: readSession() }, error: null };
              },
              async signInWithPassword({ email }) {
                if (!navigator.onLine) {
                  const existing = readSession();
                  if (existing && existing.user && existing.user.email === email) {
                    return { data: { session: existing, user: existing.user }, error: null };
                  }
                  const offlineUser = {
                    id: 'offline_' + btoa(unescape(encodeURIComponent(email))).replace(/[^a-zA-Z0-9]/g, '').slice(0, 24),
                    email: email
                  };
                  const s = writeSession(offlineUser);
                  return { data: { session: s, user: offlineUser }, error: null };
                }
                return { data: { session: null, user: null }, error: { message: 'Нет соединения с сервером авторизации' } };
              },
              async signUp() {
                return { data: { session: null, user: null }, error: { message: 'Регистрация требует подключения к сети' } };
              },
              async signOut() {
                try { localStorage.removeItem(sessionKey); } catch (e) {}
                return { error: null };
              }
            },
            from() {
              return {
                select() {
                  return {
                    eq() {
                      return {
                        async maybeSingle() {
                          return { data: null, error: { code: 'OFFLINE', message: 'Офлайн-режим' } };
                        }
                      };
                    }
                  };
                },
                async upsert() {
                  return { error: { code: 'OFFLINE', message: 'Офлайн-режим' } };
                }
              };
            }
          };
        }
      };
    }
  </script>
  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-soft: #f9fbff;
      --primary: #334e7b;
      --primary-soft: #eef3fb;
      --accent: #5b7bb2;
      --accent-soft: #e6eefc;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e6ebf2;

      --cat-court-bg: #fdf2f2;
      --cat-court-border: #f5d0d0;
      --cat-court-text: #9b3b3b;
      --cat-court-dot: #d97777;

      --cat-work-bg: #eff6ff;
      --cat-work-border: #cfe0fc;
      --cat-work-text: #2c5282;
      --cat-work-dot: #5b7bb2;

      --cat-expert-bg: #f0f9f4;
      --cat-expert-border: #cbe8d6;
      --cat-expert-text: #276749;
      --cat-expert-dot: #489c73;

      --cat-term-bg: #fffbeb;
      --cat-term-border: #f6e0a6;
      --cat-term-text: #8c5a19;
      --cat-term-dot: #d69e2e;

      --shadow-soft: 0 4px 20px rgba(51, 78, 123, 0.05);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      line-height: 1.45;
    }

    .auth-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px 22px;
      box-shadow: 0 14px 36px rgba(51, 78, 123, 0.1);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .auth-tab {
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(51, 78, 123, 0.08);
    }

    .auth-msg {
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: 11px;
      margin-bottom: 12px;
      display: none;
    }

    .auth-msg.error { display: block; background: #fef2f2; color: #b91c1c; }
    .auth-msg.success { display: block; background: #ecfdf5; color: #047857; }

    .app-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 14px 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 12px;
      min-width: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .brand-hero {
      text-align: center;
      padding: 6px 8px 16px;
    }

    .brand-emblem {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #0d1b3e;
      border: 1.5px solid #1e356b;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(13, 27, 62, 0.16);
    }

    .metric-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 0;
    }

    .metric-tile.active {
      border-color: var(--accent);
      background: var(--primary-soft);
    }

    .ios-week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
    }

    .ios-day-col {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px 3px 6px;
      min-height: 138px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .ios-day-col.selected {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 10px rgba(91, 123, 178, 0.12);
    }

    .ios-day-letter {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .ios-day-num {
      width: 24px;
      height: 24px;
      margin: 1px auto 3px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .ios-day-num.today {
      background: #e06c6c;
      color: #ffffff;
    }

    .ios-mini-event {
      width: 100%;
      border-radius: 7px;
      padding: 3px 4px;
      font-size: 9.5px;
      line-height: 1.2;
      font-weight: 600;
      text-align: left;
      overflow: hidden;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .ios-mini-event .ev-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ios-mini-event .ev-time {
      display: block;
      font-size: 8.5px;
      opacity: 0.82;
      margin-top: 1px;
    }

    .ev-court {
      background: var(--cat-court-bg);
      border-color: var(--cat-court-border);
      color: var(--cat-court-text);
    }

    .ev-work {
      background: var(--cat-work-bg);
      border-color: var(--cat-work-border);
      color: var(--cat-work-text);
    }

    .ev-expert {
      background: var(--cat-expert-bg);
      border-color: var(--cat-expert-border);
      color: var(--cat-expert-text);
    }

    .ev-term {
      background: var(--cat-term-bg);
      border-color: var(--cat-term-border);
      color: var(--cat-term-text);
    }

    .inner-accordion {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .accordion-header {
      width: 100%;
      background: var(--surface);
      border: none;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    .accordion-body {
      padding: 0 15px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface-soft);
    }

    .chevron-icon {
      transition: transform 0.2s ease;
      color: var(--muted);
      flex-shrink: 0;
    }

    .chevron-icon.open {
      transform: rotate(180deg);
    }

    .soft-input, .soft-select, .soft-textarea {
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13.5px;
      color: var(--text);
      background: #ffffff;
      font-family: inherit;
    }

    .soft-input:focus, .soft-select:focus, .soft-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 123, 178, 0.14);
    }

    .btn-soft-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s ease;
    }

    .btn-soft-secondary {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #d7e3f7;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-soft-ghost {
      background: #ffffff;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(3px);
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 10px;
    }

    @media (min-width: 640px) {
      .modal-overlay {
        align-items: center;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px rgba(30, 41, 59, 0.16);
      max-height: 88dvh;
      overflow-y: auto;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 20px rgba(51, 78, 123, 0.06);
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      padding: 8px 4px calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 45;
    }

    .nav-tab {
      border: none;
      background: transparent;
      border-radius: 13px;
      padding: 6px 2px;
      min-height: 54px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-tab span {
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-tab.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .toast-bar {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      max-width: 92vw;
      text-align: center;
    }

    .toast-bar.show {
      opacity: 1;
    }

    @media (max-width: 440px) {
      .nav-tab {
        font-size: 9px;
      }
      .ios-day-col {
        padding: 4px 2px 5px;
        min-height: 126px;
      }
      .ios-mini-event {
        padding: 2.5px 3px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-emblem" aria-label="Логотип IAR">
          <svg width="48" height="48" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 12 L100 28 V60 C100 86 82 103 60 111 C38 103 20 86 20 60 V28 Z" fill="#0d1b3e" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
            <path d="M60 19 L93 32 V59 C93 81 78 96 60 103 C42 96 27 81 27 59 V32 Z" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linejoin="round" opacity="0.7"/>
            <path d="M36 66 L54 48 L65 58 L84 39" fill="none" stroke="#38bdf8" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M70 39 H84 V53" fill="none" stroke="#38bdf8" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="60" y="88" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="1">IAR</text>
          </svg>
        </div>
        <h1 class="text-base font-extrabold text-[#1e3a6e] uppercase m-0">АВТОМАТИЗИРОВАННОЕ РАБОЧЕЕ МЕСТО СЛЕДОВАТЕЛЯ</h1>
        <p class="text-xs text-slate-500 mt-1 mb-0">Облачная синхронизация дел, календаря и бланков</p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="auth-tab active">Вход</button>
        <button type="button" id="tabRegister" class="auth-tab">Регистрация</button>
      </div>

      <div id="authMsg" class="auth-msg"></div>

      <form id="authForm" class="space-y-3">
        <div>
          <label for="authEmail" class="block text-xs font-semibold text-slate-600 mb-1">Электронная почта</label>
          <input type="email" id="authEmail" class="soft-input" placeholder="name@example.com" required autocomplete="email" />
        </div>
        <div>
          <label for="authPassword" class="block text-xs font-semibold text-slate-600 mb-1">Пароль (от 6 символов)</label>
          <input type="password" id="authPassword" class="soft-input" placeholder="••••••••" minlength="6" required autocomplete="current-password" />
        </div>
        <button type="submit" id="authSubmitBtn" class="btn-soft-primary w-full">Войти в рабочее место</button>
      </form>
    </div>
  </div>

  <div id="appShell" class="hidden">
    <div class="app-container">
      <div class="flex items-center justify-between mb-2 gap-2">
        <span id="userEmailSub" class="text-xs font-medium text-slate-400 truncate">IAR • Рабочее пространство</span>
        <div class="flex items-center gap-1.5 shrink-0">
          <span id="netChip" class="status-chip" style="cursor:default;">
            <span id="netDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="netText">Онлайн</span>
          </span>
          <button type="button" id="cloudChip" class="status-chip" onclick="pullFromCloud()" title="Синхронизировать с облаком">
            <span id="cloudDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="cloudText">Облако</span>
          </button>
        </div>
      </div>

      <!-- ==================== ВКЛАДКА 1: СВОДКА ==================== -->
      <main id="view-svodka">
        <header class="brand-hero">
          <div class="brand-emblem" aria-label="Логотип IAR">
            <svg width="48" height="48" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <path d="M60 12 L100 28 V60 C100 86 82 103 60 111 C38 103 20 86 20 60 V28 Z" fill="#0d1b3e" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
              <path d="M60 19 L93 32 V59 C93 81 78 96 60 103 C42 96 27 81 27 59 V32 Z" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linejoin="round" opacity="0.7"/>
              <path d="M36 66 L54 48 L65 58 L84 39" fill="none" stroke="#38bdf8" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M70 39 H84 V53" fill="none" stroke="#38bdf8" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="60" y="88" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-weight="800" font
